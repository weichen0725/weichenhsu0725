<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>句子積木工廠</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: patient, warm, toy-like; one task per screen, nothing that punishes
   IDEA: a toy-block workbench: a rail with coloured sockets and a tray of chunky word blocks
   PICTURE: the rail itself, with a hand-drawn scene card above it; on home, a finished demo rail
   COLOUR and TYPE: white ground, toy-yellow band, grammar colours from the spec; rounded Huninn, Kai option
   LAYOUT: single column, scene → rail → tray → big buttons; settings in a side sheet */
:root{color-scheme:light dark;
--bg:light-dark(#FFFFFF,#16171D);--ink:light-dark(#2A211C,#F4EFEA);--mute:light-dark(#5E534C,#C9C0B8);
--card:light-dark(#F2F4F8,#22242D);--line:light-dark(#CED3DD,#3D4150);
--band:light-dark(#FFC83D,#3A2F14);--bandInk:light-dark(#2A211C,#FFE7A6);
--pri:light-dark(#1A44C2,#9DB7FF);--priInk:light-dark(#FFFFFF,#0C1A3F);
--sky:light-dark(#EAF5FF,#1C2733);--me:light-dark(#E3F6D8,#1E3320);--meLine:light-dark(#7CC26A,#3F7A38);
--cs0:32px;--font:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
html[data-size=l]{--cs0:38px}html[data-size=xl]{--cs0:44px}
html[data-font=kai]{--font:"LXGW WenKai TC","BiauKai","DFKai-SB","Noto Sans TC",serif}
html[data-hc="1"]{color-scheme:light;--bg:#fff;--ink:#000;--mute:#000;--card:#fff;--line:#000;--band:#FFE14D;--bandInk:#000;--pri:#0030B0;--priInk:#fff;--sky:#fff;--me:#fff;--meLine:#000}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--font);overflow-x:clip;--cs:var(--cs0)}
html[data-tint] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:200}
html[data-tint=yellow] body::after{background:rgba(255,226,110,.22)}
html[data-tint=blue] body::after{background:rgba(120,190,255,.2)}
html[data-tint=green] body::after{background:rgba(140,220,150,.2)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:4px solid var(--pri);outline-offset:3px}
h1,h2,h3{line-height:1.1;text-wrap:balance;margin:0}
.ui{width:30px;height:30px;flex:none}
.wrap{max-width:1240px;margin:0 auto}
.band{padding:clamp(28px,4vw,56px) max(5vw,16px)}
.pb{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:180px;min-height:68px;padding:0 30px;border:0;border-radius:34px;background:var(--pri);color:var(--priInk);font-size:22px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.28);transition:transform .1s,box-shadow .1s}
.pb:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.pb[disabled]{opacity:.4;cursor:default}
.pb.alt{background:var(--card);color:var(--ink);border:3px solid var(--line)}
.rb{position:relative;display:grid;place-items:center;width:72px;height:72px;flex:none;border-radius:50%;border:3px solid var(--line);background:var(--card)}
.rb::before{content:"";position:absolute;inset:-9px;border-radius:50%}
.rb .ui{width:34px;height:34px}
.ib{position:relative;display:grid;place-items:center;width:56px;height:56px;flex:none;border-radius:16px;border:3px solid var(--line);background:var(--card)}
.ib::before{content:"";position:absolute;inset:-4px}
.rb:active,.ib:active{transform:translateY(3px)}
[hidden]{display:none!important}
/* zhuyin */
.zc{display:inline-flex;align-items:center;vertical-align:middle}
.zc .h{font-size:var(--cs);line-height:1.12}
.z{display:inline-flex;align-items:center;margin-left:2px;font:500 calc(var(--cs)*.42)/1.0 "Noto Sans TC","PingFang TC",sans-serif;letter-spacing:0}
.zcol{display:flex;flex-direction:column;align-items:center}.zcol i{font-style:normal}
.zl{font-weight:500;line-height:.7}.zt{font-weight:500;transform:translateY(-.15em)}
.pc{font-size:var(--cs);line-height:1.12}
html[data-zy="0"] .z{display:none}
/* roles */
.r-subj{--rb:#FFF8E1;--rd:#FFA000;--rt:#3E2723}.r-verb{--rb:#E8F5E9;--rd:#2E7D32;--rt:#14501A}
.r-obj{--rb:#E1F5FE;--rd:#0277BD;--rt:#014377}.r-loc{--rb:#F3E5F5;--rd:#7B1FA2;--rt:#4A148C}
.r-time{--rb:#FCE4EC;--rd:#C2185B;--rt:#880E4F}.r-adj{--rb:#E0F7FA;--rd:#00838F;--rt:#004D40}
.r-conj{--rb:#FFF3E0;--rd:#E65100;--rt:#8A2A00}
html[data-hc="1"] .blk{--rt:#000;--rd:#000;border-width:4px}html[data-hc="1"] .slot{--rd:#000}
/* blocks */
.blk{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:88px;min-width:108px;margin-right:14px;padding:18px 22px 12px;border-radius:16px;border:3px solid var(--rd);background:var(--rb);color:var(--rt);box-shadow:0 4px 0 var(--rd);font-weight:700;letter-spacing:2px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .15s,box-shadow .15s,opacity .2s}
.blk::after{content:"";position:absolute;right:-15px;top:50%;width:14px;height:28px;margin-top:-14px;background:var(--rb);border:3px solid var(--rd);border-left:0;border-radius:0 14px 14px 0}
.k-square::after{border-radius:0 4px 4px 0}.k-half::after{height:18px;margin-top:-9px;border-radius:0 9px 9px 0}
.k-diamond::after{width:16px;height:16px;margin-top:-8px;right:-8px;transform:rotate(45deg);border-left:0;border-bottom:0;border-radius:2px}
.k-lock::after{width:18px;background:linear-gradient(90deg,var(--rb) 35%,var(--rd) 35% 60%,var(--rb) 60%);border-radius:0 5px 5px 0}
.ri{position:absolute;left:6px;top:5px;width:18px;height:18px;color:var(--rd)}
.blk .w{display:inline-flex;flex-wrap:wrap;justify-content:center}
.blk .why{display:none;position:absolute;bottom:-26px;left:0;right:0;font-size:13px;letter-spacing:0;color:var(--mute);text-align:center}
.blk.dim{opacity:.55}.blk.dim .why{display:block}
.blk.press{transform:scale(.96);box-shadow:0 0 0 var(--rd)}
.blk.dragging{z-index:50;opacity:.9;transition:none;box-shadow:0 16px 26px rgba(0,0,0,.28)}
.blk.sel{transform:translateY(-6px);outline:4px dashed var(--pri);outline-offset:5px}
.blk.hl{transform:scale(1.06);box-shadow:0 0 0 7px #FFD54F,0 4px 0 var(--rd)}
.blk.demo{min-height:70px;min-width:80px;padding:14px 16px 8px;--cs:26px}
[data-hint=soft] .blk{background:#fff;color:#222;border-color:#A5ABB8;border-left:10px solid var(--rd);box-shadow:0 4px 0 #A5ABB8}
[data-hint=soft] .blk::after{background:#fff;border-color:#A5ABB8}
[data-hint=soft] .slot{background:var(--card)}
[data-hint=plain] .blk{background:#fff;color:#222;border-color:#8A909C;box-shadow:0 4px 0 #8A909C}
[data-hint=plain] .blk::after{background:#fff;border-color:#8A909C}
[data-hint=plain] .ri,[data-hint=plain] .slot .slab{display:none}
[data-hint=plain] .slot{--rd:#8A909C;background:var(--card)}
/* rail + slots */
.track{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:20px 18px 26px;border-radius:24px;background:var(--card);border:3px solid var(--line)}
.track::after{content:"";position:absolute;left:18px;right:18px;bottom:10px;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--line) 0 18px,transparent 18px 28px)}
.slot{position:relative;display:flex;align-items:center;justify-content:center;min-width:120px;min-height:96px;padding:4px;border-radius:18px;border:3px dashed var(--rd);background:var(--rb);transition:box-shadow .2s}
.slab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:16px;font-weight:700;color:var(--rt)}
.slab .ri{position:static;width:28px;height:28px}
.slot.filled{border-color:transparent;background:transparent;padding:0;min-width:0}
.slot.filled .slab{display:none}
.slot.over{box-shadow:0 0 0 4px var(--rd);animation:breath 1.2s infinite}
.picking .slot:not(.filled){box-shadow:0 0 0 4px var(--rd)}
@keyframes breath{50%{box-shadow:0 0 0 10px color-mix(in srgb,var(--rd) 30%,transparent)}}
.slot.cue{animation:cue .35s 4 alternate}
@keyframes cue{to{background:var(--rd)}}
.slot.ok::before{content:"";position:absolute;inset:-6px;border-radius:24px;border:5px solid #43A047;animation:ring .7s forwards;pointer-events:none}
@keyframes ring{from{opacity:1;transform:scale(.9)}to{opacity:0;transform:scale(1.25)}}
.stx{display:inline-flex;flex-wrap:wrap;align-items:center;font-weight:700;letter-spacing:2px;border-radius:10px;padding:2px 4px}
.stx.hl{background:#FFE58A;color:#2A211C}
.tray{display:flex;flex-wrap:wrap;justify-content:center;gap:22px 20px;min-height:132px;padding:22px 14px 30px;border-radius:24px;background:light-dark(#FFF6DA,#2A2618);box-shadow:inset 0 4px 0 rgba(0,0,0,.06)}
html[data-hc="1"] .tray{background:#fff;border:3px solid #000}
.tray:empty::before{content:"積木都放好了";align-self:center;color:var(--mute)}
/* task screen */
.tbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:12px max(4vw,16px);background:var(--band);color:var(--bandInk)}
.tbar .ib,.tbar .rb{background:rgba(255,255,255,.55);border-color:rgba(0,0,0,.15);color:#2A211C}
.ttl{flex:1;display:flex;flex-direction:column;line-height:1.25}.ttl small{font-size:15px}.ttl b{font-size:22px}
.tk-in{max-width:1000px;margin:0 auto;padding:18px max(4vw,16px) 48px;display:flex;flex-direction:column;gap:18px}
.prog{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.prog i{width:14px;height:14px;border-radius:50%;background:var(--line)}.prog i.d{background:#43A047}.prog i.n{background:var(--pri);transform:scale(1.35)}
.scene{align-self:center;height:clamp(170px,30vh,280px);aspect-ratio:160/110;max-width:100%;border-radius:24px;overflow:hidden;background:var(--sky);border:3px solid var(--line)}
.scene.is3d,.place .scene{background:radial-gradient(120% 90% at 50% 20%,#FFFFFF,#D3E9F8)}
.scene canvas.gl{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
.scene canvas.gl:active{cursor:grabbing}
.scene.wide{aspect-ratio:320/150;height:clamp(170px,32vh,290px)}
.scene svg,.scene img{display:block;width:100%;height:100%;object-fit:cover}
.scene.party svg,.scene.party img{animation:hop .5s 2}
@keyframes hop{50%{transform:translateY(-8px) scale(1.03)}}
.ask{--cs:calc(var(--cs0)*.72);margin:0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;font-weight:700;text-align:center}
.ask .ui{width:34px;height:34px;color:var(--pri)}
.hint{display:flex;align-items:center;gap:12px;min-height:64px}
.mas{width:56px;height:56px;flex:none}
.ht{margin:0;flex:1;padding:10px 16px;border-radius:18px;background:var(--card);font-size:19px;font-weight:700;color:var(--mute)}
.hint.say .ht{color:var(--ink);background:light-dark(#FFF1C2,#3A3220)}
.actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:24px}
.pb.go{animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 5px 0 rgba(0,0,0,.28),0 0 0 10px color-mix(in srgb,var(--pri) 25%,transparent)}}
/* frames */
.fr{border-radius:24px;padding:14px;border:3px solid var(--line)}
.frh{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:10px}
.av{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--pri);color:var(--priInk)}.av .ui{width:24px;height:24px}
.fr.chat{background:light-dark(#DCE8F5,#1B2430)}
.fr.chat .track{margin-left:auto;max-width:96%;background:var(--me);border-color:var(--meLine);border-bottom-right-radius:6px}
.fr.note{background:light-dark(#FFFBEA,#2B2818);background-image:repeating-linear-gradient(transparent 0 46px,light-dark(#E8DFC0,#3D3826) 46px 48px)}
.fr.note .track{background:transparent;border-style:dashed}
.sign{text-align:right;font-weight:700;margin-top:8px}
/* detective */
.opts{display:grid;gap:18px}
.optw{display:flex;align-items:center;gap:14px}
.opt{flex:1;min-height:100px;padding:18px 24px;border-radius:22px;border:3px solid var(--line);background:var(--card);text-align:left;font-weight:700;letter-spacing:2px;--cs:calc(var(--cs0)*.88);box-shadow:0 4px 0 var(--line)}
.opt.good{border-color:#43A047;box-shadow:0 0 0 7px rgba(67,160,71,.25),0 4px 0 #43A047}
.opt.tried{opacity:.5}
/* adventure */
.chat{display:flex;flex-direction:column;gap:16px}
.bub{max-width:100%;padding:14px 16px;border-radius:22px;--cs:calc(var(--cs0)*.8)}
.bub .who{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:var(--mute);margin-bottom:4px}
.bub.npc{align-self:flex-start;display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);border-bottom-left-radius:6px}
.bub.npc .who{width:100%}
.bub.me{align-self:stretch;background:var(--me);border:3px solid var(--meLine);border-bottom-right-radius:6px}
.bub.me .track{background:transparent;border-style:dashed}
.tip{margin:0;text-align:center;font-weight:700;color:var(--mute)}
.places{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:20px}
.place{display:flex;flex-direction:column;gap:12px;padding:0 0 18px;border-radius:24px;border:3px solid var(--line);background:var(--card);overflow:hidden;text-align:left}
.place .scene{height:auto;width:100%;border:0;border-radius:0;aspect-ratio:320/150}
.place b{font-size:22px;padding:0 18px}.place span{padding:0 18px;color:var(--mute)}
.badge{display:inline-flex;align-items:center;gap:6px;margin:0 18px;font-weight:700;color:#2E7D32}
/* home */
.hero{background:var(--band);color:var(--bandInk);padding:clamp(28px,5vw,64px) max(5vw,16px)}
.hero-in{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(20px,4vw,48px);align-items:center}
.brand{margin:0 0 10px;font-size:15px;font-weight:700}
h1{font-size:clamp(40px,6.4vw,64px);font-weight:900;line-height:1.05}
.lead{font-size:19px;max-width:30em;margin:16px 0 0}
.demo{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:28px;background:light-dark(#FFFFFF,#20232C);box-shadow:0 10px 0 rgba(0,0,0,.12)}
.demo .scene{height:auto;width:min(100%,340px);aspect-ratio:160/110}
.demo .track{justify-content:center;background:var(--card)}
h2{font-size:30px;margin:0 0 18px}
.sec+.sec{margin-top:44px}
.stages,.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:20px}
.stg{display:flex;flex-direction:column;gap:8px;min-height:150px;padding:20px 22px;border-radius:24px;border:4px solid var(--line);background:var(--card);text-align:left}
.stg b{font-size:26px}.stg small{font-size:16px;color:var(--mute)}
.stg[aria-pressed=true]{border-color:var(--pri);box-shadow:0 0 0 5px color-mix(in srgb,var(--pri) 22%,transparent)}
.stg[aria-pressed=true] b::after{content:"　已選擇";font-size:15px;color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px 3px 6px;border-radius:999px;background:var(--rb);color:var(--rt);border:2px solid var(--rd);font-size:14px;font-weight:700}
.chip .ri{position:static;width:16px;height:16px}
.mod{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:24px;background:var(--card);border:3px solid var(--line)}
.mod svg.art{width:100%;height:120px}
.mod b{font-size:24px}.mod p{margin:0;color:var(--mute)}
.mod .pb{margin-top:auto;align-self:flex-start}
.shelf{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:40px;padding:16px 20px;border-radius:20px;background:var(--card);font-weight:700}
.shelf svg{width:34px;height:34px}
footer{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:24px max(5vw,16px);border-top:3px solid var(--line)}
footer .acts{display:flex;flex-wrap:wrap;gap:14px}
footer .pb{min-width:0;min-height:56px;font-size:18px}
/* teacher */
.panel{padding:22px;border-radius:24px;background:var(--card);border:3px solid var(--line)}
.panel+.panel{margin-top:24px}.panel h2{font-size:26px}
.panel p.note{color:var(--mute);margin:6px 0 14px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:end}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:16px;flex:1 1 220px}
input[type=text],select{min-height:52px;padding:8px 14px;font-size:17px;border:2px solid var(--line);border-radius:14px;background:var(--bg)}
input[type=file]{font-size:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:14px;margin:16px 0}
.stat{padding:14px 16px;border-radius:18px;background:var(--bg);border:2px solid var(--line)}
.stat b{display:block;font-size:34px;line-height:1.1;white-space:nowrap}.stat span{font-size:15px;color:var(--mute)}
.bars{display:grid;gap:10px;margin:10px 0 18px}
.bar{display:grid;grid-template-columns:9em minmax(0,1fr) 3.5em;gap:12px;align-items:center;font-size:16px}
.bar .t{height:22px;border-radius:11px;background:var(--bg);border:2px solid var(--line);overflow:hidden}
.bar .t i{display:block;height:100%;background:#E65100}
.bar em{font-style:normal;text-align:right;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.n{text-align:right;white-space:nowrap}
.cus{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cus .s{flex:1 1 260px;font-weight:700}.cus small{display:block;font-weight:400;color:var(--mute)}
.cus img{width:72px;height:50px;object-fit:cover;border-radius:10px}
.msg{min-height:1.6em;font-weight:700;color:var(--pri)}
textarea{width:100%;min-height:160px;font:15px/1.5 var(--font);padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.scroll{overflow-x:auto}
/* sheet + modal */
.ov{position:fixed;inset:0;z-index:100;display:none;background:rgba(0,0,0,.45)}
.ov.on{display:flex;justify-content:flex-end}
.sheet{width:min(460px,100%);height:100%;overflow:auto;background:var(--bg);padding:20px 22px 40px}
.sheet h2{display:flex;align-items:center;justify-content:space-between;font-size:26px}
.srow{padding:14px 0;border-bottom:1px solid var(--line)}
.srow>b{display:block;margin-bottom:8px}
.srow small{display:block;margin-top:6px;color:var(--mute);font-size:14px}
.seg{display:flex;flex-wrap:wrap;gap:10px}
.seg button{min-height:56px;min-width:72px;padding:0 14px;border-radius:14px;border:3px solid var(--line);background:var(--card);font-weight:700}
.seg button[aria-pressed=true]{background:var(--pri);color:var(--priInk);border-color:var(--pri)}
.modal{margin:auto;width:min(420px,92%);padding:24px;border-radius:24px;background:var(--bg);text-align:center}
.modal .actions{margin-top:18px}
.fin{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:40px 16px}
.fin svg{width:160px;height:160px}.fin h2{font-size:40px;margin:0}
html[data-rm="1"] *,html[data-rm="1"] *::before{animation:none!important;transition:opacity .1s!important}
/* 複句 */
.r-evt{--rb:#F9FBE7;--rd:#827717;--rt:#3E3A00}
.track.cx{gap:12px;align-items:stretch;padding:16px 14px 28px}
.cl{position:relative;flex:1 1 auto;max-width:100%;display:flex;flex-direction:column;justify-content:center;padding:44px 12px 14px;border:3px solid var(--line);border-radius:22px;background:var(--bg)}
.clin{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px}
